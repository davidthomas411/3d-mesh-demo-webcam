<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fast SAM 3D Body Live Mesh</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
    }

    #controls {
      padding: 12px;
    }

    button {
      padding: 10px 18px;
      font-size: 16px;
    }

    #status {
      margin-top: 10px;
      white-space: pre-wrap;
    }

    #views {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding: 8px;
      height: calc(100vh - 110px);
    }

    video, #overlay, #mesh {
      width: 100%;
      height: 100%;
      min-height: 400px;
      object-fit: contain;
      background: black;
      border: 1px solid #555;
    }

    canvas.capture {
      display: none;
    }

    /* Teams-friendly demo layout */
    #controls {
      display: grid;
      grid-template-columns: auto auto 1fr;
      gap: 10px;
      align-items: start;
      padding: 12px 16px;
    }

    #status {
      grid-column: 3;
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    #latencyHud {
      grid-column: 1 / -1;
      margin: 4px 0 0;
      padding: 12px 16px;
      background: #181818;
      border: 1px solid #555;
      color: #7dff9b;
      font: 700 20px/1.35 monospace;
      white-space: pre;
      overflow-x: auto;
    }

    #views {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 10px 10px;
      height: calc(100vh - 325px);
      min-height: 520px;
    }

    #leftViews {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 10px;
      min-width: 0;
      min-height: 0;
    }

    #video, #overlay, #mesh {
      width: 100%;
      height: 100%;
      min-height: 0;
      object-fit: contain;
      background: #000;
      border: 1px solid #555;
      box-sizing: border-box;
    }

    #mesh {
      min-width: 0;
      min-height: 0;
    }
  </style>
</head>

<body>
  <div id="controls">
    <button id="start">Start webcam and inference</button>
    <button id="stop" disabled>Stop webcam</button>
    <div id="status">Waiting to start</div>
  </div>

  <div id="views">
    <button id="toggleRuntimePanel" type="button">Hide parameters</button>
    <div id="runtimePanel">
      <div class="panelTitle">Runtime Parameters</div>

      <label>
        Inference mode
        <select id="inferenceMode">
          <option value="body" selected>Body only, low latency</option>
          <option value="full">Full body + hands</option>
        </select>
      </label>

      <label>
        Camera intrinsics
        <select id="intrinsicsMode">
          <option value="fixed" selected>Fixed calibrated median</option>
          <option value="dynamic">Dynamic MoGe per frame</option>
        </select>
      </label>

      <div class="controlRow">
        <button id="recalibrate" type="button">Recalibrate</button>
        <span id="calibrationStatus">Calibration: unknown</span>
      </div>

      <label class="checkRow">
        <input id="lockMeshCenter" type="checkbox" checked>
        Lock independent 3D center
      </label>

      <label class="checkRow">
        <input id="showOverlay" type="checkbox" checked>
        Show projected overlay
      </label>

      <label>
        Overlay density
        <select id="overlayDensity">
          <option value="24">Dense</option>
          <option value="48" selected>Medium</option>
          <option value="96">Sparse</option>
        </select>
      </label>

      <label>
        Overlay opacity
        <input id="overlayOpacity"
               type="range"
               min="0.2"
               max="1"
               step="0.05"
               value="0.95">
      </label>

      <label>
        Overlay line width
        <input id="overlayLineWidth"
               type="range"
               min="0.5"
               max="4"
               step="0.25"
               value="1.5">
      </label>

      <button id="resetMeshCamera" type="button">
        Reset 3D camera
      </button>

      <div id="serverConfig">
        512 model input · YOLO11m-Pose<br>
        RTX A6000 · WebSocket · 8 CPU threads
      </div>
    </div>

    <pre id="latencyHud">Latency HUD: waiting for data</pre>
    <div id="leftViews">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>
    <div id="mesh"></div>
  </div>

  <canvas id="capture" class="capture"></canvas>

  <script type="module">
    import * as THREE from
      "https://esm.sh/three@0.180.0";

    import { OrbitControls } from
      "https://esm.sh/three@0.180.0/examples/jsm/controls/OrbitControls.js";

    const button = document.getElementById("start");
    const stopButton = document.getElementById("stop");
    const video = document.getElementById("video");
    const status = document.getElementById("status");
    const latencyHud = document.getElementById("latencyHud");
    const toggleRuntimePanel =
      document.getElementById("toggleRuntimePanel");
    const runtimePanel =
      document.getElementById("runtimePanel");
    const capture = document.getElementById("capture");
    const context = capture.getContext("2d");
    const overlayCanvas = document.getElementById("overlay");
    const overlayContext = overlayCanvas.getContext("2d");
    const meshView = document.getElementById("mesh");
    const inferenceModeSelect = document.getElementById("inferenceMode");
    const intrinsicsModeSelect = document.getElementById("intrinsicsMode");
    const recalibrateButton = document.getElementById("recalibrate");
    const calibrationStatus = document.getElementById("calibrationStatus");
    const lockMeshCenter = document.getElementById("lockMeshCenter");
    const showOverlay = document.getElementById("showOverlay");
    const overlayDensity = document.getElementById("overlayDensity");
    const overlayOpacity = document.getElementById("overlayOpacity");
    const overlayLineWidth = document.getElementById("overlayLineWidth");
    const resetMeshCamera = document.getElementById("resetMeshCamera");

    let renderer;
    let scene;
    let camera;
    let controls;
    let bodyMesh;
    let topology;
    let lastMeshId = 0;
    let framesSent = 0;
    let uploadBusy = false;
    let running = false;
    let mediaStream = null;
    let streamSocket = null;
    let pendingMeshMetadata = null;
    let websocketRequestStartMs = 0;
    let meshFramed = false;
    let latestEncodeMs = 0;
    const latencyHistory = { encode: [], upload: [], intake: [], queue: [], decode: [], inference: [], transfer: [], render: [], endToEnd: [] };
    const frameTimings = new Map();

    function recordLatency(name, value) {
      if (!Number.isFinite(value)) return;
      const values = latencyHistory[name];
      values.push(value);
      if (values.length > 120) values.shift();
    }

    function latencyStats(name) {
      const values = latencyHistory[name];
      if (!values.length) {
        return { current: 0, median: 0, p90: 0 };
      }

      const sorted = [...values].sort((a, b) => a - b);
      const percentile = p =>
        sorted[Math.min(
          sorted.length - 1,
          Math.floor((sorted.length - 1) * p)
        )];

      return {
        current: values[values.length - 1],
        median: percentile(0.50),
        p90: percentile(0.90)
      };
    }

    function formatLatencyRow(label, name) {
      const x = latencyStats(name);
      return (
        label.padEnd(18) +
        x.current.toFixed(1).padStart(8) +
        x.median.toFixed(1).padStart(9) +
        x.p90.toFixed(1).padStart(9)
      );
    }

    function updateLatencyHud() {
      const row = (label, name) => {
        const x = latencyStats(name);
        return (
          label.padEnd(17) +
          x.current.toFixed(1).padStart(8) +
          x.median.toFixed(1).padStart(9) +
          x.p90.toFixed(1).padStart(9)
        );
      };

      latencyHud.textContent = [
        "LATENCY             NOW   MEDIAN      P90",
        "-------------------------------------------",
        "INPUT",
        row("JPEG encode", "encode"),
        "",
        "SERVER / MODEL",
        row("Server queue", "queue"),
        row("JPEG decode", "decode"),
        row("Inference", "inference"),
        "",
        "OUTPUT",
        row("Network + HTTP", "transfer"),
        row("Browser render", "render"),
        "-------------------------------------------",
        row("TOTAL", "endToEnd"),
        "",
        "All values in milliseconds"
      ].join("\n");
    }

    function initializeRenderer() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x101010);

      camera = new THREE.PerspectiveCamera(
        45,
        meshView.clientWidth / meshView.clientHeight,
        0.01,
        100
      );

      camera.position.set(0, 0, 4);

      renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false
      });

      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(
        meshView.clientWidth,
        meshView.clientHeight
      );

      meshView.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      scene.add(new THREE.HemisphereLight(
        0xffffff,
        0x303030,
        2.5
      ));

      const directional = new THREE.DirectionalLight(
        0xffffff,
        2.0
      );

      directional.position.set(2, 3, 4);
      scene.add(directional);

      window.addEventListener("resize", resizeRenderer);

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }

      animate();
    }

    function resizeRenderer() {
      if (!renderer) return;

      const width = meshView.clientWidth;
      const height = meshView.clientHeight;

      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    async function loadTopology() {
      const response = await fetch("/topology");

      if (!response.ok) {
        throw new Error(
          "Topology unavailable: HTTP " + response.status
        );
      }

      topology = await response.json();

      if (!topology.ready) {
        throw new Error("Estimator is not ready");
      }

      const geometry = new THREE.BufferGeometry();

      geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
          new Float32Array(topology.vertex_count * 3),
          3
        )
      );

      geometry.setIndex(
        new THREE.BufferAttribute(
          new Uint32Array(topology.faces),
          1
        )
      );

      const material = new THREE.MeshStandardMaterial({
        color: 0x4aa3ff,
        roughness: 0.65,
        metalness: 0.05,
        side: THREE.DoubleSide
      });

      bodyMesh = new THREE.Mesh(geometry, material);
      bodyMesh.rotation.z = Math.PI;
      bodyMesh.rotation.y = Math.PI;
      scene.add(bodyMesh);
    }

    function updateMesh(vertexValues) {
      const geometry = bodyMesh.geometry;
      const positions = geometry.attributes.position.array;

      positions.set(vertexValues);
      geometry.attributes.position.needsUpdate = true;

      if (!meshFramed || !lockMeshCenter.checked) {
        geometry.computeVertexNormals();
        geometry.computeBoundingBox();
        geometry.computeBoundingSphere();

        const center = new THREE.Vector3();
        geometry.boundingBox.getCenter(center);

        bodyMesh.position.set(
          center.x,
          center.y,
          -center.z
        );

        const radius = geometry.boundingSphere.radius;

        if (radius > 0) {
          camera.position.set(0, 0, radius * 3.0);
          camera.near = Math.max(radius / 100, 0.001);
          camera.far = radius * 100;
          camera.updateProjectionMatrix();

          controls.target.set(0, 0, 0);
          controls.update();
        }

        meshFramed = true;
      }
    }

    function updateOverlay(vertices, predCamT, focalLength) {
      if (!showOverlay.checked) {
        overlayCanvas.style.visibility = "hidden";
        return;
      }
      overlayCanvas.style.visibility = "visible";
      if (!video.videoWidth || !topology) return;

      const width = 640;
      const height = Math.round(
        width * video.videoHeight / video.videoWidth
      );

      overlayCanvas.width = width;
      overlayCanvas.height = height;

      overlayContext.drawImage(video, 0, 0, width, height);

      const cx = width / 2;
      const cy = height / 2;
      const projected = new Float32Array(topology.vertex_count * 2);

      for (let i = 0; i < topology.vertex_count; i++) {
        const j = i * 3;
        const x = vertices[j] + predCamT[0];
        const y = vertices[j + 1] + predCamT[1];
        const z = vertices[j + 2] + predCamT[2];
        const k = i * 2;

        projected[k] = focalLength * x / z + cx;
        projected[k + 1] = focalLength * y / z + cy;
      }

      overlayContext.strokeStyle =
        "rgba(180, 255, 0, " + overlayOpacity.value + ")";
      overlayContext.lineWidth = Number(overlayLineWidth.value);
      overlayContext.beginPath();

      const faces = topology.faces;

      const faceStride = Number(overlayDensity.value);

      for (let i = 0; i < faces.length; i += faceStride) {
        const a = faces[i] * 2;
        const b = faces[i + 1] * 2;
        const c = faces[i + 2] * 2;

        overlayContext.moveTo(projected[a], projected[a + 1]);
        overlayContext.lineTo(projected[b], projected[b + 1]);
        overlayContext.lineTo(projected[c], projected[c + 1]);
        overlayContext.closePath();
      }

      overlayContext.stroke();
    }

    function sendRuntimeConfig(action, value = null) {
      if (
        !streamSocket ||
        streamSocket.readyState !== WebSocket.OPEN
      ) {
        return;
      }

      const message = {
        type: "config",
        action: action
      };

      if (value !== null) {
        message.value = value;
      }

      if (action === "recalibrate") {
        message.frames = 30;
      }

      streamSocket.send(JSON.stringify(message));
    }

    function updateCalibrationStatus(metadata) {
      const calibrated = Boolean(metadata.calibrated);
      const samples = Number(metadata.calibration_samples || 0);

      calibrationStatus.textContent =
        calibrated
          ? "Calibration: ready (" + samples + " samples)"
          : "Calibration: collecting " + samples + " / 30";

      if (metadata.inference_mode) {
        inferenceModeSelect.value = metadata.inference_mode;
      }

      if (metadata.intrinsics_mode) {
        intrinsicsModeSelect.value = metadata.intrinsics_mode;
      }
    }

    function connectStreamSocket() {
      return new Promise((resolve, reject) => {
        const protocol =
          window.location.protocol === "https:" ? "wss:" : "ws:";

        streamSocket = new WebSocket(
          protocol + "//" + window.location.host + "/stream"
        );

        streamSocket.binaryType = "arraybuffer";

        streamSocket.onopen = () => {
          status.textContent =
            "WebSocket connected. Starting inference...";

          sendRuntimeConfig(
            "set_inference_mode",
            inferenceModeSelect.value
          );

          sendRuntimeConfig(
            "set_intrinsics_mode",
            intrinsicsModeSelect.value
          );

          resolve();
        };

        streamSocket.onerror = () => {
          reject(new Error("WebSocket connection failed"));
        };

        streamSocket.onclose = () => {
          if (running) {
            status.textContent = "WebSocket disconnected";
          }
        };

        streamSocket.onmessage = event => {
          if (typeof event.data === "string") {
            const metadata = JSON.parse(event.data);

            if (metadata.error) {
              uploadBusy = false;
              status.textContent =
                "Inference error: " + metadata.error;

              if (running) {
                window.setTimeout(sendFrame, 0);
              }
              return;
            }

            if (metadata.type === "config") {
              updateCalibrationStatus(metadata);
              return;
            }

            updateCalibrationStatus(metadata);
            pendingMeshMetadata = metadata;
            return;
          }

          if (!pendingMeshMetadata) {
            uploadBusy = false;
            status.textContent =
              "Received mesh without metadata";
            return;
          }

          const metadata = pendingMeshMetadata;
          pendingMeshMetadata = null;

          const requestCycleMs =
            performance.now() - websocketRequestStartMs;

          const vertices = new Float32Array(event.data);
          const queueWaitMs = metadata.queue_wait_ms;
          const decodeMs = metadata.decode_ms;
          const inferenceMs = metadata.inference_ms;
          const encodeMs = metadata.encode_ms;

          const networkMs = Math.max(
            0,
            requestCycleMs -
            queueWaitMs -
            decodeMs -
            inferenceMs
          );

          lastMeshId = metadata.mesh_id;

          const renderStartMs = performance.now();

          updateMesh(vertices);
          updateOverlay(
            vertices,
            metadata.pred_cam_t,
            metadata.focal_length
          );

          const renderMs =
            performance.now() - renderStartMs;

          const totalMs =
            Date.now() -
            Number(metadata.capture_timestamp_ms);

          framesSent++;

          recordLatency("encode", encodeMs);
          recordLatency("queue", queueWaitMs);
          recordLatency("decode", decodeMs);
          recordLatency("inference", inferenceMs);
          recordLatency("transfer", networkMs);
          recordLatency("render", renderMs);
          recordLatency("endToEnd", totalMs);
          updateLatencyHud();

          status.textContent =
            "Camera active" +
            " | frames: " + framesSent +
            " | mesh: " + metadata.mesh_id +
            " | inference: " +
            inferenceMs.toFixed(1) + " ms" +
            " | end-to-end: " +
            totalMs.toFixed(0) + " ms";

          uploadBusy = false;

          if (running) {
            window.setTimeout(sendFrame, 0);
          }
        };
      });
    }

    async function sendFrame() {
      if (
        !running ||
        uploadBusy ||
        !video.videoWidth ||
        !streamSocket ||
        streamSocket.readyState !== WebSocket.OPEN
      ) {
        return;
      }

      uploadBusy = true;
      const captureTimestampMs = Date.now();

      capture.width = 640;
      capture.height = Math.round(
        640 * video.videoHeight / video.videoWidth
      );

      context.drawImage(
        video,
        0,
        0,
        capture.width,
        capture.height
      );

      try {
        const encodeStartMs = performance.now();

        const blob = await new Promise(resolve => {
          capture.toBlob(resolve, "image/jpeg", 0.80);
        });

        const encodeMs =
          performance.now() - encodeStartMs;

        if (!blob) {
          throw new Error("JPEG encoding failed");
        }

        websocketRequestStartMs = performance.now();

        streamSocket.send(JSON.stringify({
          capture_timestamp_ms: captureTimestampMs,
          encode_ms: encodeMs
        }));

        streamSocket.send(blob);

      } catch (error) {
        uploadBusy = false;
        status.textContent =
          "WebSocket frame error: " + error.message;

        if (running) {
          window.setTimeout(sendFrame, 0);
        }
      }
    }

    toggleRuntimePanel.onclick = () => {
      const isHidden =
        runtimePanel.style.display === "none";

      runtimePanel.style.display =
        isHidden ? "" : "none";

      toggleRuntimePanel.textContent =
        isHidden ? "Hide parameters" : "Show parameters";
    };

    inferenceModeSelect.onchange = () => {
      uploadBusy = false;
      pendingMeshMetadata = null;

      sendRuntimeConfig(
        "set_inference_mode",
        inferenceModeSelect.value
      );

      status.textContent =
        "Switching inference mode to " +
        inferenceModeSelect.options[
          inferenceModeSelect.selectedIndex
        ].text +
        ". First use may compile.";
    };

    intrinsicsModeSelect.onchange = () => {
      sendRuntimeConfig(
        "set_intrinsics_mode",
        intrinsicsModeSelect.value
      );
    };

    recalibrateButton.onclick = () => {
      intrinsicsModeSelect.value = "dynamic";
      calibrationStatus.textContent =
        "Calibration: collecting 0 / 30";
      sendRuntimeConfig("recalibrate");
    };

    lockMeshCenter.onchange = () => {
      if (lockMeshCenter.checked) {
        meshFramed = false;
      }
    };

    showOverlay.onchange = () => {
      overlayCanvas.style.visibility =
        showOverlay.checked ? "visible" : "hidden";
    };

    resetMeshCamera.onclick = () => {
      meshFramed = false;
    };

    stopButton.onclick = () => {
      running = false;
      if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
      mediaStream = null;
      video.srcObject = null;

      if (streamSocket) {
        streamSocket.close();
        streamSocket = null;
      }

      pendingMeshMetadata = null;
      uploadBusy = false;
      stopButton.disabled = true;
      button.disabled = false;
      status.textContent = "Webcam stopped";
    };

    button.onclick = async () => {
      try {
        button.disabled = true;
        status.textContent = "Starting camera...";

        mediaStream =
          await navigator.mediaDevices.getUserMedia({
            video: {
              width: { ideal: 1280 },
              height: { ideal: 720 }
            },
            audio: false
          });

        video.srcObject = mediaStream;
        await video.play();

        initializeRenderer();
        status.textContent = "Loading mesh topology...";

        await loadTopology();

        await connectStreamSocket();

        running = true;
        stopButton.disabled = false;
        status.textContent =
          "Camera active. Waiting for first mesh...";

        sendFrame();
      } catch (error) {
        button.disabled = false;
        status.textContent =
          error.name + ": " + error.message;
      }
    };
  </script>
</body>
</html>

<style>
#views {
  grid-template-columns: minmax(390px,0.85fr) minmax(480px,1.1fr) minmax(480px,1.1fr);
  grid-template-rows: auto 1fr;
  height: calc(100vh - 75px);
  align-items: stretch;
}
#runtimePanel {
  position: static;
  grid-column: 1;
  grid-row: 1;
  width: auto;
  margin: 0;
  z-index: auto;
}
#latencyHud {
  grid-column: 1;
  grid-row: 2;
  padding: 18px;
  margin: 0;
  min-height: 0;
