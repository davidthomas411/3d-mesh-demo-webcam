<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webcam to Anatomy Pipeline</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#5c6370;--line:#d5d9df;--card:#f6f7f9;
 --live:#1f6feb;--livebg:#f1f6ff;--ct:#b35c00;--ctbg:#fff7ee;--skel:#7a3db8;--skelbg:#f8f3ff;--out:#1a7f4b;--outbg:#f0faf4}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--fg:#e8e9ec;--mut:#9aa1ad;--line:#2d3138;--card:#1d2026;
 --live:#6aa5ff;--livebg:#162133;--ct:#e0a050;--ctbg:#2a2014;--skel:#c09bf0;--skelbg:#221a2e;--out:#4cc38a;--outbg:#14261c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1180px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:28px;margin:0 0 4px}
.lede{color:var(--mut);margin:0 0 14px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:4px 12px;font-size:14px}
.btn:hover{border-color:var(--mut)}
.crumb{color:var(--mut);font-size:14px;margin-left:auto}
.stage{border:2px solid var(--c);background:var(--cb);border-radius:12px;margin:0}
.stage[data-k=live]{--c:var(--live);--cb:var(--livebg)}
.stage[data-k=ct]{--c:var(--ct);--cb:var(--ctbg)}
.stage[data-k=skel]{--c:var(--skel);--cb:var(--skelbg)}
.stage[data-k=out]{--c:var(--out);--cb:var(--outbg)}
.head{width:100%;text-align:left;background:none;border:0;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.head .n{font-weight:700;font-size:18px;color:var(--c)}
.head .s{grid-column:1;color:var(--fg);font-size:15px}
.head .chev{grid-row:1/3;grid-column:2;font-size:22px;color:var(--c);transition:transform .15s}
.stage.open .chev{transform:rotate(90deg)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:12px;border:1px solid var(--line);border-radius:10px;padding:0 8px;color:var(--mut);background:var(--bg)}
.tag.ok{color:var(--out);border-color:var(--out)}.tag.no{color:#c0392b;border-color:#c0392b}
.body{display:none;padding:0 14px 14px}
.stage.open .body{display:block}
.steps{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.step{flex:1 0 170px;max-width:240px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:4px}
.step:hover{border-color:var(--c)}
.step[aria-expanded=true]{border:2px solid var(--c);padding:7px}
.step .no{font-size:12px;color:var(--c);font-weight:700}
.step .t{font-weight:600;font-size:15px;line-height:1.25}
.step .o{font-size:13px;color:var(--mut);line-height:1.35}
.step img{width:100%;height:84px;object-fit:cover;border-radius:4px;background:#111}
.arrow{align-self:center;color:var(--mut);flex:0 0 auto}
.link{text-align:center;color:var(--mut);font-size:14px;margin:8px 0}
.detail{display:none;margin-top:10px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.detail.on{display:block}
.detail h3{margin:0 0 4px;font-size:18px}
.detail .cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media(max-width:760px){.detail .cols{grid-template-columns:1fr}}
.detail img.big{width:100%;border-radius:6px;background:#111}
.detail ul{margin:6px 0;padding-left:20px}
.detail li{margin:3px 0}
.io{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px;margin:8px 0}
.io b{color:var(--mut);font-weight:600}
code{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:.88em;word-break:break-word}
.note{border-left:3px solid var(--c);background:var(--card);padding:6px 10px;margin:8px 0;font-size:14px}
.gap{height:6px}
.across{text-align:center;color:var(--mut);font-size:14px;margin:6px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two.stack{grid-template-columns:1fr}
.two>*,.stage,.body,.detail,.cols>div{min-width:0}
@media(max-width:860px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>Webcam to anatomy, inside the body</h1>
<p class="lede">A webcam frame becomes a body mesh with a skeleton, a simulated X-ray and a CT slice that follow the person. Click a stage to open its steps, then a step for the detail.</p>
<div class="bar">
  <button class="btn" id="expand">Open all stages</button>
  <button class="btn" id="collapse">Close all</button>
  <span class="crumb" id="crumb">Overview</span>
</div>
<div id="app"></div>
</main>

 tags:[["runs live",""],["GPU",""]], steps:[
 {t:"Webcam frame", o:"JPEG over a WebSocket", img:"webcam",
  d:"The browser grabs a frame, encodes it as a JPEG and sends it to the local Flask server over a WebSocket.",
  io:[["In","camera video"],["Out","JPEG bytes"],["Code","webcam.html, webcam_server.py"]],
  pts:["Server listens on port 8097. The camera only works on <code>localhost</code> or <code>127.0.0.1</code>, not on the PC's network address.","JPEG encode takes about 9 to 12 ms in the browser; decode on the server about 1 ms.","Opening the page in a second tab doubles the GPU load, which shows up as seconds of latency."]},
 {t:"Find the person", o:"YOLO box + depth", img:"detect",
  d:"A pose detector finds and tracks one person. A depth and field-of-view model places them in metric space so the mesh gets the right size and distance.",
  io:[["Models","YOLO11m-Pose, MoGe2 (moge-2-vits-normal, FP16)"],["Out","person box, camera focal length"],["Log","<code>FOCAL_CALIBRATED</code>, <code>tracked_box=True</code>"]],
  pts:["With several people in view the server keeps following the one it was already on, else the largest near the centre.","The focal length is calibrated over the first 30 frames, then logged.","<code>tracked_box=False</code> in the log means the box was lost for that frame and the detector re-ran."]},
 {t:"Fit a body mesh", o:"MHR mesh + 127 joints", img:"mesh",
  d:"Fast SAM 3D Body predicts the person's pose and shape and outputs a mesh in the MHR body model's format, plus the model's joint skeleton.",
  io:[["Model","Fast SAM 3D Body, DINOv3 backbone at 384 px"],["Out","18,439 vertices, 36,874 faces, 127 joint positions and rotations"],["Speed","median about 165 to 190 ms on an RTX A2000"]],
  pts:["Ready when the log prints <code>ESTIMATOR_READY</code>.","The backbone can run as a TensorRT engine; an engine is specific to one GPU and one TensorRT version, so it is built per PC.","The jaw does not move: the estimator's face parameters are switched off. The page gets jaw opening from a browser face tracker instead."]},
 {t:"Stream to the page", o:"float32 vertices + joints", img:null,
  d:"The server sends the result back as raw binary. The page smooths the display between frames.",
  io:[["Out","float32 vertices plus joint data per frame"],["Code","anatomy/stream.js (RigStream)"],["Latency","end-to-end about 155 to 305 ms"]],
  pts:["<code>RigStream</code> keeps the last two meshes with their capture times and estimates the mesh at the current display time, so the 60 Hz display does not wait for the roughly 6 Hz inference.","The latency panel splits the time into JPEG encode, queue, decode, inference, network and render."]}
]},
{k:"ct", name:"2 · Built once: CT anatomy atlas", sub:"A real CT, cut into organ and bone meshes and fitted inside the MHR body.",
 tags:[["built once",""],["in git","ok"],["default bones and organs",""]], steps:[
 {t:"Reference CT + labels", o:"e0279 (default), s1159", img:"ct",
  d:"The anatomy comes from a real CT scan that already has one mask per structure. Nothing is predicted from the webcam.",
  io:[["Default","<code>e0279</code>: ENHANCE.PET study 0279, head-to-toe PET-CT, CC BY-NC 4.0"],["Second","<code>s1159</code>: TotalSegmentator dataset (Zenodo 10047292), CC BY 4.0, head to upper thigh"],["Tools","<code>tools/enhance_subject.py</code>, <code>tools/fetch_ts_subject.py</code>"]],
  pts:["For e0279 the dataset ships CT-derived labels, so no segmentation model is run. For s1159 the masks are the dataset's ground truth (117 classes).","Your own CT works too if you run TotalSegmentator on it first.","The image shows real CT slices of the reference subject (coronal and sagittal)."]},
 {t:"Masks to meshes", o:"114 structures", img:null,
  d:"Each mask becomes a surface mesh small enough to render live.",
  io:[["Code","<code>anatomy/atlas_build.py</code>"],["Steps","marching cubes, Taubin smoothing, quadric decimation (triangle budget by volume)"],["Out","114 structures, about 140k triangles"]],
  pts:["Open meshes such as the scapula and costal cartilage cannot be sliced as closed volumes, so the label CT slice leaves them out."]},
 {t:"Fit into the MHR body", o:"warp soft tissue, place bones", img:null,
  d:"The CT is of a lying-down person; the avatar stands and has a different shape. The CT skin is registered to the neutral MHR body, and the anatomy goes with it.",
  io:[["Code","<code>anatomy/atlas_build.py</code>, <code>tools/fit_skeleton_to_mhr.py</code>"],["Method","landmark similarity, then three thin-plate-spline rounds on torso and head skin"],["Rule","soft tissue is warped; bones are never warped, only re-placed rigidly"]],
  pts:["Warping bones was tried and distorted them (an L3 vertebra swelled to 130 x 122 mm), so each bone only takes its placement from the warp.","Limb bones are swung onto the MHR limb axis, because the CT has arms down and MHR is in a T-pose.","A smooth field pushes every structure inside the skin (ribs at least 10 mm deep, spine at least 22 mm where possible).","The skull, shoulder girdle and pelvis are seated by a small optimisation with priors, so they do not end up in the belly."]},

const app = document.getElementById("app");
const crumb = document.getElementById("crumb");
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const stageEls = {};

STAGES.forEach((st, si) => {
  const wrap = el("section", "stage");
  wrap.dataset.k = st.k;
  const head = el("button", "head");
  head.setAttribute("aria-expanded", "false");
  head.append(el("span", "n", st.name), el("span", "chev", "&#9656;"), el("span", "s", st.sub));
  const tags = el("div", "tags"); tags.style.gridColumn = "1";
  st.tags.forEach(([t, c]) => tags.append(el("span", "tag " + c, t)));
  tags.append(el("span", "tag", st.steps.length + " steps"));
  head.append(tags);
  const body = el("div", "body");
  const steps = el("div", "steps");
  const detail = el("div", "detail");
  st.steps.forEach((s, i) => {
    if (i) steps.append(el("span", "arrow", "&rarr;"));
    const b = el("button", "step");
    b.setAttribute("aria-expanded", "false");
    b.innerHTML = '<span class="no">STEP ' + (i + 1) + '</span><span class="t">' + s.t + '</span>' +
      (s.img ? '<img alt="" src="' + IMG[s.img] + '">' : '') + '<span class="o">' + s.o + '</span>';
    b.onclick = () => openStep(si, i, true);
    steps.append(b);
  });
  body.append(steps, detail);
  wrap.append(head, body);
  head.onclick = () => toggleStage(si);
  app.append(wrap);
  if (si < STAGES.length - 1) app.append(el("div", "across", si === 0 ? "&darr; the live joints pose the atlas &darr;" : si === 1 ? "&darr; both skeletons are posed the same way &darr;" : ""));
  stageEls[si] = {wrap, head, steps, detail};
});
// the CT and SKEL lanes sit side by side
(function pairLanes(){
  const a = stageEls[1].wrap, b = stageEls[2].wrap;
  const row = el("div", "two");
  a.before(row); row.append(a, b);
  const sep = stageEls[1].wrap.nextSibling; // across text after CT is now after row; remove the one between lanes
  document.querySelectorAll(".across").forEach((n, i) => { if (i === 1) n.remove(); });
})();

function setCrumb(si, i) {
  crumb.textContent = si == null ? "Overview" : STAGES[si].name + (i != null ? "  >  " + STAGES[si].steps[i].t : "");
}
function toggleStage(si, force) {
  const s = stageEls[si];
  const open = force != null ? force : !s.wrap.classList.contains("open");
  s.wrap.classList.toggle("open", open);
  s.head.setAttribute("aria-expanded", open);
  if (!open) { s.detail.classList.remove("on"); [...s.steps.querySelectorAll(".step")].forEach(b => b.setAttribute("aria-expanded", "false")); }
  const pr = document.querySelector('.two'); if (pr) pr.classList.toggle('stack', pr.querySelector('.stage.open') != null);
  setCrumb(open ? si : null);
  history.replaceState(null, "", open ? "#" + STAGES[si].k : "#");
}
function openStep(si, i, scroll) {
  toggleStage(si, true);
  const s = stageEls[si], d = STAGES[si].steps[i];
  const btns = s.steps.querySelectorAll(".step");
  const already = btns[i].getAttribute("aria-expanded") === "true";
  btns.forEach(b => b.setAttribute("aria-expanded", "false"));
  if (already) { s.detail.classList.remove("on"); setCrumb(si); return; }
  btns[i].setAttribute("aria-expanded", "true");
  const io = d.io.map(([k, v]) => "<b>" + k + "</b><span>" + v + "</span>").join("");
  const pts = d.pts.map(p => "<li>" + p + "</li>").join("");
  s.detail.innerHTML = '<h3>' + d.t + '</h3><div class="cols"><div><p>' + d.d + '</p><div class="io">' + io + '</div><ul>' + pts + '</ul></div>' +
    (d.img ? '<div><img class="big" alt="' + d.t + '" src="' + IMG[d.img] + '"></div>' : '') + '</div>';
  if (!d.img) s.detail.querySelector(".cols").style.gridTemplateColumns = "1fr";
  s.detail.classList.add("on");
  setCrumb(si, i);
  history.replaceState(null, "", "#" + STAGES[si].k + "/" + (i + 1));
  if (scroll) s.detail.scrollIntoView({behavior: "smooth", block: "nearest"});
}
document.getElementById("expand").onclick = () => STAGES.forEach((_, i) => toggleStage(i, true));
document.getElementById("collapse").onclick = () => STAGES.forEach((_, i) => toggleStage(i, false));
(function fromHash() {
  const m = location.hash.match(/^#(live|ct|skel|out)(?:\/(\d+))?$/);
  if (!m) return;
  const si = STAGES.findIndex(s => s.k === m[1]);
  if (m[2]) openStep(si, +m[2] - 1, false); else toggleStage(si, true);
})();
</script>
