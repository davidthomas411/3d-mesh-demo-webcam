<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js"}}</script>
<canvas id="c" width="1100" height="640"></canvas>
<script type="module">
import * as THREE from "three";
import { loadAtlas, AnatomyLayer } from "/anatomy/anatomy.js";
import { XrayView } from "/anatomy/xray.js";
const q = new URLSearchParams(location.search), frame = +(q.get("frame") || 0);
const canvas = document.getElementById("c"), renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setSize(1100, 640, false); renderer.setPixelRatio(1);
const atlas = await loadAtlas("/atlas/atlas.json", "/atlas/atlas.bin");
const layer = new AnatomyLayer(THREE, atlas, { flipYZ: false, spine: "physio" });
const NV = 18439 * 3, buf = await (await fetch("/skins.bin")).arrayBuffer(), skin = new Float32Array(buf, frame * NV * 4, NV);

const t0 = performance.now(); layer.update(skin, 0, 1); const t1 = performance.now();
renderer.setClearColor(0x000000, 1); renderer.clear();
xr.render("ap", [0, -1.3, 0], { x: 0, y: 0, w: 550, h: 640 });
xr.render("lateral", [0, -1.3, 0], { x: 550, y: 0, w: 550, h: 640 });
renderer.getContext().finish(); const t2 = performance.now();
window.__done = { poseMs: t1 - t0, drawMs: t2 - t1, meshes: xr.meshes.length, gl: renderer.getContext().getParameter(renderer.getContext().VERSION), halfFloat: !!renderer.extensions.get("EXT_color_buffer_float") || !!renderer.extensions.get("EXT_color_buffer_half_float") };
</script>
